# Production Configuration for AWS Deployment
# =============================================

# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/soccer_recommendations}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# FootyStats API
footystats.api.key=${FOOTYSTATS_API_KEY:}
footystats.api.base-url=https://api.football-data-api.com

# Logging
logging.level.root=INFO
logging.level.com.jcm.recommendations.soccer=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator (Health Checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration
# Set this to your CloudFront URL in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
