# Production Configuration for AWS Deployment
# =============================================

# Server Configuration (port 80 for Docker/EB deployment)
server.port=${PORT:80}

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/soccer_recommendations}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Never expose H2 console in production
spring.h2.console.enabled=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# FootyStats API
footystats.api.key=${FOOTYSTATS_API_KEY:}
footystats.api.base-url=https://api.football-data-api.com

# Logging
logging.level.root=INFO
logging.level.com.jcm.recommendations.soccer=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator (Health Checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration
# Set this to your CloudFront / site URL(s) in production (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Beta auth — set real secrets via env; do not commit production passwords
beta.auth.enabled=${BETA_AUTH_ENABLED:true}
beta.auth.site-password=${BETA_SITE_PASSWORD}
beta.auth.admin-password=${BETA_ADMIN_PASSWORD}

# Cross-origin HTTPS session cookies (SPA on different host)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

