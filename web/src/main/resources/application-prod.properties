# =============================================================================
# Production Configuration for AWS Deployment
# =============================================================================
# Activate with: --spring.profiles.active=prod
# =============================================================================

# Server (port 80 for Docker/App Runner deployment)
server.port=${PORT:80}

# -----------------------------------------------------------------------------
# PostgreSQL Database
# -----------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/soccer_recommendations}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Never expose H2 console in production
spring.h2.console.enabled=false

# -----------------------------------------------------------------------------
# Scheduler (enabled for production)
# -----------------------------------------------------------------------------
# Data sync runs at 4:00 AM daily (Europe/London timezone)
# Results ingest/settlement runs at 6:00 AM daily
scheduler.enabled=${SCHEDULER_ENABLED:true}
# Override cron expressions via env vars if needed:
# scheduler.cron=${SCHEDULER_CRON:0 0 4 * * ?}
# scheduler.results-cron=${SCHEDULER_RESULTS_CRON:0 0 6 * * ?}

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.jcm.recommendations.soccer=INFO
logging.level.org.hibernate.SQL=WARN

# -----------------------------------------------------------------------------
# Actuator (Health Checks for App Runner/ELB)
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# Security & Authentication
# -----------------------------------------------------------------------------
# Beta auth — set real secrets via environment variables
beta.auth.enabled=${BETA_AUTH_ENABLED:true}
beta.auth.site-password=${BETA_SITE_PASSWORD}
beta.auth.admin-password=${BETA_ADMIN_PASSWORD}

# Cross-origin session cookies (SPA on different host)
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# -----------------------------------------------------------------------------
# CORS Configuration
# -----------------------------------------------------------------------------
# Set to your CloudFront / site URL(s) via CORS_ALLOWED_ORIGINS env var
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
