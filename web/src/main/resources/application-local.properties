# =============================================================================
# Local Development Profile
# =============================================================================
# Activate with: --spring.profiles.active=local
# =============================================================================

# Server
server.port=8080

# H2 Database (file-based for persistence across restarts)
spring.datasource.url=jdbc:h2:file:./data/soccer-recommendations;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging (verbose for development)
logging.level.root=INFO
logging.level.com.jcm.recommendations.soccer=DEBUG
logging.level.com.jcm.recommendations.soccer.core.client=DEBUG
# Uncomment for SQL debugging:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Scheduler (disabled - use manual trigger endpoints)
scheduler.enabled=false

# Beta auth (simple defaults for local testing)
beta.auth.enabled=true
beta.auth.site-password=beta
beta.auth.admin-password=admin

# Session cookie (HTTP-friendly for localhost)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# CORS (local dev servers)
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# API Key - set via environment variable FOOTYSTATS_API_KEY
# or uncomment and add your key here:
# footystats.api.key=YOUR_API_KEY_HERE
