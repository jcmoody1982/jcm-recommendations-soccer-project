# =============================================================================
# Base Configuration (shared across all profiles)
# =============================================================================
# Profile-specific settings should go in:
#   - application-local.properties (local development)
#   - application-prod.properties  (production deployment)
# =============================================================================

# Default to local unless overridden (Docker/EB set spring.profiles.active=prod)
spring.profiles.default=local

# Application name
spring.application.name=soccer-recommendations

# JPA/Hibernate (shared settings)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.packagesToScan=com.jcm.recommendations.soccer.domain
spring.data.jpa.repositories.bootstrap-mode=default
spring.main.allow-bean-definition-overriding=true

# FootyStats API
footystats.api.base-url=https://api.football-data-api.com
footystats.api.key=${FOOTYSTATS_API_KEY:}
footystats.api.timeout-seconds=30
footystats.api.max-retries=3

# Transfermarkt-derived squad value (additive enrichment; disabled until configured)
transfermarkt.enabled=false
transfermarkt.base-url=${TRANSFERMARKT_API_BASE_URL:}
transfermarkt.api-key=${TRANSFERMARKT_API_KEY:}
transfermarkt.freshness-days=7
transfermarkt.rate-limit-ms=300
transfermarkt.mapping-resource=transfermarkt/team-mapping.csv

# Results configuration
results.timezone=Europe/London
results.pending-lookback-days=7

# Scheduler (disabled by default, enable in prod profile)
scheduler.enabled=false
scheduler.cron=0 0 4 * * ?
scheduler.results-cron=0 0 6 * * ?

# Session configuration (shared)
server.servlet.session.cookie.name=ABGSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=12h
